<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FallGameDev's Page! </title>
<link rel="icon" type="image/x-icon" href="maksy.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#181428;
    --card:#221c38;
    --card-hover:#2a2245;
    --melon:#57ab46;
    --melon-light:#79cf67;
    --rind:#faf3df;
    --lavender:#c1aef0;
    --cream:#f6efdd;
    --muted: rgba(246,239,221,0.6);
    --line: rgba(255,255,255,0.06);
  }

  *{box-sizing:border-box;}

  body.custom-cursor-active *{
    cursor:inherit !important;
  }

  body{
    margin:0;
    min-height:100vh;
    background: var(--night);
    background-image: radial-gradient(circle at 50% -10%, rgba(87,171,70,0.22), transparent 42%);
    color:var(--cream);
    font-family:'Poppins', sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:64px 20px 44px;
  }

  a{color:inherit; text-decoration:none;}

  .page{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* ---------- PROFILE ---------- */
  .click-counter{
    font-family:'Fredoka One', cursive;
    font-size:13px;
    color:var(--melon-light);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 14px;
    margin-bottom:12px;
    user-select:none;
    display:none;
  }
  .click-counter.visible{
    display:inline-block;
  }

  .avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 0 0 3px var(--night), 0 0 0 5px var(--melon), 0 14px 30px -14px rgba(87,171,70,0.6);
    cursor:pointer;
    transition:transform .1s ease;
    user-select:none;
  }
  .avatar:active{transform:scale(0.93);}
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .name{
    font-family:'Fredoka One', cursive;
    font-size:22px;
    color:var(--rind);
    margin:0 0 8px;
    letter-spacing:0.3px;
  }

  .bio{
    font-size:12.5px;
    font-weight:400;
    line-height:1.6;
    color:var(--muted);
    max-width:300px;
    margin:0 0 30px;
  }

  /* ---------- MUSIC PLAYER ---------- */
  .music-player{
    display:none;
    align-items:center;
    gap:10px;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    margin-bottom:18px;
  }
  .music-player.visible{
    display:flex;
  }
  .music-player select{
    flex:1;
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:12.5px;
    color:var(--rind);
    background:var(--night);
    border:1px solid var(--line);
    border-radius:9px;
    padding:8px 10px;
    outline:none;
    cursor:pointer;
  }
  .music-player select option{
    background:var(--night);
    color:var(--rind);
  }
  .music-player .play-btn{
    flex-shrink:0;
    width:36px;
    height:36px;
    border-radius:9px;
    border:none;
    background:var(--melon-light);
    color:var(--night);
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, transform .12s ease;
  }
  .music-player .play-btn:hover{background:var(--melon);}
  .music-player .play-btn:active{transform:scale(0.94);}
  .music-player .loop-btn{
    background:var(--night);
    border:1px solid var(--line);
    color:var(--muted);
  }
  .music-player .loop-btn:hover{background:var(--night);}
  .music-player .loop-btn.active{
    background:var(--melon-light);
    border-color:var(--melon-light);
    color:var(--night);
  }

  /* ---------- CURSOR PICKER ---------- */
  .cursor-picker{
    display:none;
    align-items:center;
    gap:10px;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    margin-bottom:18px;
  }
  .cursor-picker.visible{
    display:flex;
  }
  .cursor-picker select{
    flex:1;
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:12.5px;
    color:var(--rind);
    background:var(--night);
    border:1px solid var(--line);
    border-radius:9px;
    padding:8px 10px;
    outline:none;
    cursor:pointer;
  }
  .cursor-picker select option{
    background:var(--night);
    color:var(--rind);
  }

  /* ---------- BACKGROUND PICKER ---------- */
  .bg-picker{
    display:none;
    align-items:center;
    gap:10px;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    margin-bottom:18px;
  }
  .bg-picker.visible{
    display:flex;
  }
  .bg-picker select{
    flex:1;
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:12.5px;
    color:var(--rind);
    background:var(--night);
    border:1px solid var(--line);
    border-radius:9px;
    padding:8px 10px;
    outline:none;
    cursor:pointer;
  }
   .bg-picker select option{
    background:var(--night);
    color:var(--rind);
  }

  /* ---------- OFFLINE EARNINGS BANNER ---------- */
  .offline-banner{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%) translateY(-12px);
    background:var(--card);
    border:1px solid var(--melon-light);
    color:var(--rind);
    font-family:'Poppins', sans-serif;
    font-size:12.5px;
    font-weight:500;
    padding:10px 16px;
    border-radius:12px;
    box-shadow:0 12px 30px -14px rgba(0,0,0,0.6);
    z-index:1000;
    opacity:0;
    transition:opacity .4s ease, transform .4s ease;
    max-width:90vw;
    text-align:center;
  }
  .offline-banner.visible{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ---------- TABS ---------- */
  .tabs{
    display:flex;
    gap:8px;
    width:100%;
    margin-bottom:22px;
  }
  .tab-btn{
    flex:1;
    font-family:'Fredoka One', cursive;
    font-size:12.5px;
    color:var(--muted);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 8px;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover{
    color:var(--rind);
    transform:translateY(-1px);
  }
  .tab-btn.active{
    background:var(--melon);
    border-color:var(--melon);
    color:var(--night);
  }

  /* ---------- LINK LIST ---------- */
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:13px;
    margin-bottom:40px;
  }

  .link-card{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:11px 16px;
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .link-card:hover{
    transform:translateY(-2px);
    background:var(--card-hover);
    box-shadow:0 12px 24px -16px rgba(0,0,0,0.5);
  }
  .link-card:active{transform:translateY(0);}

  .link-thumb{
    width:42px;
    height:42px;
    border-radius:11px;
    overflow:hidden;
    flex-shrink:0;
    background:var(--melon);
  }
  .link-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .link-text{
    flex:1;
    text-align:left;
    min-width:0;
  }
  .link-text h3{
    font-family:'Fredoka One', cursive;
    font-weight:400;
    margin:0 0 2px;
    font-size:13px;
    color:var(--rind);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .link-text p{
    margin:0;
    font-size:11px;
    font-weight:400;
    line-height:1.4;
    color:var(--muted);
    display:-webkit-box;
    -webkit-line-clamp:1;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .link-arrow{
    flex-shrink:0;
    font-size:15px;
    color:var(--melon-light);
    transition:transform .15s ease;
  }
  .link-card:hover .link-arrow{transform:translateX(3px);}

  .empty-state{
    border:1px dashed var(--line);
    border-radius:16px;
    padding:30px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    width:100%;
  }

  /* ---------- SHOP ---------- */
  .shop-card{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 16px;
  }
  .shop-info{
    flex:1;
    text-align:left;
    min-width:0;
  }
  .shop-info h3{
    font-family:'Fredoka One', cursive;
    font-weight:400;
    margin:0 0 2px;
    font-size:13px;
    color:var(--rind);
  }
  .shop-info p{
    margin:0;
    font-size:11px;
    font-weight:400;
    line-height:1.4;
    color:var(--muted);
  }
  .shop-info .owned{
    color:var(--lavender);
    font-weight:600;
  }
  .buy-btn{
    flex-shrink:0;
    font-family:'Fredoka One', cursive;
    font-size:11.5px;
    color:var(--night);
    background:var(--melon-light);
    border:none;
    border-radius:10px;
    padding:9px 12px;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease, opacity .12s ease;
  }
  .buy-btn:hover:not(:disabled){transform:translateY(-1px); background:var(--melon);}
  .buy-btn:active:not(:disabled){transform:translateY(0);}
  .buy-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  .save-load-bar{
    display:flex;
    gap:10px;
    width:100%;
  }
  .save-load-bar button{
    flex:1;
    font-family:'Fredoka One', cursive;
    font-size:12px;
    color:var(--rind);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 8px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, color .12s ease;
  }
  .save-load-bar button:hover{
    border-color:var(--melon);
    color:var(--melon-light);
    transform:translateY(-1px);
  }

  /* ---------- DVD LOGO ---------- */
  .dvd-logo{
    position:fixed;
    top:0;
    left:0;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:26px;
    line-height:1.05;
    text-align:center;
    background:none;
    pointer-events:none;
    z-index:999;
    user-select:none;
    white-space:pre;
  }
  .dvd-logo.behind{
    z-index:-1;
  }

  /* ---------- CREWMATE ---------- */
  .crewmate{
    position:fixed;
    width:36px;
    height:48px;
    z-index:998;
    cursor:pointer;
  }
  .crewmate .body{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .4s ease;
  }
  .crewmate .shell{
    position:absolute;
    inset:0;
    background:var(--ccolor);
    border-radius:16px 16px 10px 10px;
    box-shadow:inset -5px 0 8px rgba(0,0,0,0.25);
    transition:box-shadow .25s ease;
  }
  .crewmate.tasking .shell{
    box-shadow:inset -5px 0 8px rgba(0,0,0,0.25), 0 0 0 3px #ff4d4d;
  }
  .crewmate.done .shell{
    box-shadow:inset -5px 0 8px rgba(0,0,0,0.25), 0 0 0 3px #4dff88;
  }
  .crewmate .visor{
    position:absolute;
    top:6px;
    left:16px;
    width:18px;
    height:11px;
    background:linear-gradient(180deg,#dff6ff,#9fd8f2);
    border-radius:7px;
    box-shadow:0 0 0 2px var(--ccolor);
  }
  .crewmate .backpack{
    position:absolute;
    top:14px;
    right:-5px;
    width:9px;
    height:18px;
    background:var(--ccolor);
    filter:brightness(0.72);
    border-radius:5px;
  }
  .crewmate .legs{
    position:absolute;
    bottom:-4px;
    left:5px;
    width:26px;
    height:10px;
    background:var(--ccolor);
    border-radius:0 0 6px 6px;
  }
  .crewmate.facing-left .backpack{
    left:-5px;
    right:auto;
  }
  .crewmate:hover:not(.dead) .body{
    transform:translateY(-3px);
  }
  .crewmate.dead{
    cursor:default;
  }
  .crewmate.dead .body{
    transform:rotate(90deg) translate(2px, -2px);
  }
  .crewmate.dead .visor{
    opacity:0.5;
  }
  .crewmate.dead::after{
    content:"";
    position:absolute;
    bottom:-6px;
    left:50%;
    transform:translateX(-50%);
    width:54px;
    height:20px;
    background:radial-gradient(ellipse at center, rgba(200,30,30,0.55), transparent 72%);
    border-radius:50%;
    z-index:-1;
  }
  .crewmate.working .body{
    animation:task-bob .3s ease-in-out infinite alternate;
  }
  @keyframes task-bob{
    from{ transform:translateY(0); }
    to{ transform:translateY(-3px); }
  }

  /* ---------- TASK MARKERS ---------- */
  .task-marker{
    position:fixed;
    bottom:4px;
    width:16px;
    height:16px;
    border-radius:4px;
    background:var(--melon-light);
    box-shadow:0 0 0 2px rgba(0,0,0,0.35);
    z-index:997;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:10px;
    color:var(--night);
  }

  /* ---------- SPOOPY BUTTON ---------- */
  .spoopy-btn{
    position:fixed;
    top:16px;
    right:16px;
    width:40px;
    height:40px;
    padding:0;
    border:none;
    background:none;
    cursor:pointer;
    opacity:0.25;
    z-index:500;
    transition:opacity .2s ease, transform .15s ease;
  }
  .spoopy-btn:hover{
    opacity:0.45;
    transform:scale(1.05);
  }
  .spoopy-btn img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  /* ---------- MYSTERY MENU ---------- */
  .mystery-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,8,16,0.85);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
    padding:20px;
  }
  .mystery-overlay.visible{
    display:flex;
  }
  .mystery-box{
    width:100%;
    max-width:340px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7);
    position:relative;
  }
  .mystery-close{
    position:absolute;
    top:10px;
    right:12px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }
  .mystery-close:hover{
    color:var(--rind);
  }
  .mystery-title{
    font-family:'Fredoka One', cursive;
    font-size:20px;
    color:var(--rind);
    margin:0 0 18px;
  }
  .mystery-input{
    width:100%;
    font-family:'Poppins', sans-serif;
    font-size:14px;
    color:var(--rind);
    background:var(--night);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 14px;
    outline:none;
    margin-bottom:14px;
    box-sizing:border-box;
  }
  .mystery-input:focus{
    border-color:var(--melon-light);
  }
  .mystery-submit{
    width:100%;
    font-family:'Fredoka One', cursive;
    font-size:13px;
    color:var(--night);
    background:var(--melon-light);
    border:none;
    border-radius:10px;
    padding:11px;
    cursor:pointer;
    transition:background .15s ease, transform .12s ease;
  }
  .mystery-submit:hover{
    background:var(--melon);
  }
  .mystery-submit:active{
    transform:scale(0.97);
  }
  .mystery-spinner{
    width:40px;
    height:40px;
    margin:10px auto 0;
    border-radius:50%;
    border:4px solid rgba(255,255,255,0.15);
    border-top-color:var(--melon-light);
    animation:mystery-spin .8s linear infinite;
  }
  @keyframes mystery-spin{
    to{ transform:rotate(360deg); }
  }

  /* ---------- ADMIN PANEL ---------- */
  .admin-panel{
    position:fixed;
    top:90px;
    left:16px;
    width:260px;
    background:var(--card);
    border:1px solid var(--melon-light);
    border-radius:14px;
    box-shadow:0 24px 50px -18px rgba(0,0,0,0.7);
    z-index:3000;
    display:none;
    overflow:hidden;
  }
  .admin-panel.visible{
    display:block;
  }
  .admin-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--night);
    padding:10px 12px;
    font-family:'Fredoka One', cursive;
    font-size:12.5px;
    color:var(--rind);
    cursor:move;
    user-select:none;
    touch-action:none;
  }
  .admin-header-btns{
    display:flex;
    gap:6px;
  }
  .admin-icon-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:15px;
    cursor:pointer;
    line-height:1;
    padding:2px 4px;
  }
  .admin-icon-btn:hover{
    color:var(--rind);
  }
  .admin-body{
    padding:12px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:60vh;
    overflow-y:auto;
  }
  .admin-panel.collapsed .admin-body{
    display:none;
  }
  .admin-panel.expanded{
    top:0 !important;
    left:0 !important;
    width:100vw !important;
    max-width:100vw;
    height:100vh;
    border-radius:0;
  }
  .admin-panel.expanded .admin-body{
    max-height:calc(100vh - 46px);
  }
  .admin-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-family:'Poppins', sans-serif;
    font-size:11.5px;
    color:var(--muted);
  }
  .admin-row input[type="number"]{
    width:78px;
    background:var(--night);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--rind);
    padding:6px 8px;
    font-family:'Poppins', sans-serif;
    font-size:12px;
    outline:none;
  }
  .admin-row input[type="checkbox"]{
    width:18px;
    height:18px;
    accent-color:var(--melon-light);
    cursor:pointer;
  }
  .admin-apply{
    margin-top:4px;
    font-family:'Fredoka One', cursive;
    font-size:12.5px;
    color:var(--night);
    background:var(--melon-light);
    border:none;
    border-radius:10px;
    padding:10px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .admin-apply:hover{
    background:var(--melon);
  }

  /* ---------- FOOTER ---------- */
  footer{
    color:rgba(246,239,221,0.32);
    font-size:12px;
    font-weight:400;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
    .link-card:hover{transform:none;}
  }
</style>
</head>
<body>

<button class="spoopy-btn" id="spoopy-btn" title="???">
  <img src="spoopy.png" alt="">
</button>

<div class="page">

  <div class="click-counter" id="click-counter">0 clicks</div>

  <div class="avatar" id="avatar">
    <img src="profile.png" alt="FallGameDev profile picture">
  </div>

  <h1 class="name">FallGameDev</h1>
  <p class="bio">Indie game developer building weird little worlds across GameMaker, Godot, and Roblox.</p>

  <div class="music-player" id="music-player">
    <select id="song-select"></select>
    <button class="play-btn" id="play-btn">&#9658;</button>
    <button class="play-btn loop-btn" id="loop-btn" title="Loop">&#8635;</button>
  </div>
  <audio id="song-audio"></audio>
  <input type="file" id="load-input" accept="application/json" style="display:none">

  <div class="cursor-picker" id="cursor-picker">
    <select id="cursor-select"></select>
  </div>
  <input type="file" id="import-file-input" style="display:none">

  <div class="bg-picker" id="bg-picker">
    <select id="bg-select"></select>
  </div>

  <div class="tabs" id="tab-list"></div>

  <div class="links" id="link-list"></div>

  <footer>FallGameDev &mdash; made with duct tape, coffee, and a little chaos.</footer>

</div>

<script>
  /* ======================================================

       name  - the title shown on the link
       desc  - a short description
       link  - where it goes when clicked
       image - path or URL to the thumbnail image
     Add as many items as you want to any list below.
     ====================================================== */
  const PROJECTS = [

  const VIDEOS = [

  const LINKS = [

      image: "https://placehold.co/100x100/faf3df/181428?text=YT"
    },
    {

      desc: "Play the games as they release.",
      link: "#",
      image: "https://placehold.co/100x100/c1aef0/181428?text=IO"
    }
  ];

  const TABS = [
    { id: "projects", label: "Projects", data: PROJECTS },
    { id: "videos", label: "Videos", data: VIDEOS },
    { id: "links", label: "Links", data: LINKS },
    { id: "shop", label: "Shop", data: null }
  ];

  let activeTab = TABS[0].id;

  const tabBar = document.getElementById('tab-list');
  const list = document.getElementById('link-list');
  const counterEl = document.getElementById('click-counter');
  const avatarEl = document.getElementById('avatar');
  const loadInput = document.getElementById('load-input');

  loadInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => importSave(reader.result);
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ---------- CLICKER GAME STATE ---------- */
  const SAVE_KEY = 'fallgamedev-clicker-save';

  function defaultGame(){
    return {
      clicks: 0,
      clickPower: 1,
      clickBoostOwned: 0,
      autoClickerOwned: 0,
      dvdOwned: 0,
      dvdBehind: false,
      amogusOwned: 0,
      amogusAlive: 0,
      musicPlayerOwned: false,
      musicLoop: false,
      selectedSong: 0,
      cursorsOwned: false,
      selectedCursor: 'default',
       bgOwned: false,
      selectedBg: 'default',
      offlineEarningsOwned: false,
      lastSeen: null,
      customBackgrounds: [],
      customSongs: [],
      customCursors: []
    };
  }

  let game = defaultGame();

  function loadGame(){
    try {
      const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (saved) game = Object.assign(defaultGame(), saved);
    } catch(e) {}
  }

    function saveGame(){
    try {
      game.lastSeen = Date.now();
      localStorage.setItem(SAVE_KEY, JSON.stringify(game));
    } catch(e) {}
  }

  function clearEntities(){
    document.querySelectorAll('.crewmate').forEach(el => el.remove());
    document.querySelectorAll('.dvd-logo').forEach(el => el.remove());
  }

  function exportSave(){
    const blob = new Blob([JSON.stringify(game, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fallgamedev-save.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importSave(jsonText){
    let parsed;
    try {
      parsed = JSON.parse(jsonText);
    } catch(e) {
      alert("That doesn't look like a valid save file.");
      return;
    }

    clearEntities();
    game = Object.assign(defaultGame(), parsed);
    if (game.amogusAlive === undefined) game.amogusAlive = game.amogusOwned;
    loadCustomAssets();

    updateCounter();
    saveGame();

    if (game.musicPlayerOwned) showMusicPlayer();
    if (game.cursorsOwned) showCursorPicker();
    if (game.bgOwned) showBgPicker();
    for (let i = 0; i < game.dvdOwned; i++) spawnDvd();
    for (let i = 0; i < game.amogusAlive; i++) spawnCrewmate();

    renderShop();
  }

  function updateCounter(){
    counterEl.textContent = game.clicks.toLocaleString() + (game.clicks === 1 ? ' click' : ' clicks');
    if (game.clicks > 0) counterEl.classList.add('visible');
  }

  avatarEl.addEventListener('click', () => {
    game.clicks += game.clickPower;
    updateCounter();
    saveGame();
    if (activeTab === 'shop') renderShop();
  });

  setInterval(() => {
    if (game.autoClickerOwned > 0) {
      game.clicks += game.autoClickerOwned;
      updateCounter();
      saveGame();
      if (activeTab === 'shop') renderShop();
    }
  }, 1000);

  function clickBoostCost(){ return 10 * (game.clickBoostOwned + 1); }
  function autoClickerCost(){ return 50 * (game.autoClickerOwned + 1); }
  const DVD_COST = 100;
  const AMOGUS_COST = 100;
  const MUSIC_PLAYER_COST = 500;
  const CURSOR_COST = 300;
  const CORNER_BONUS = 10000;
  const BG_COST = 400;
  const OFFLINE_COST = 100000;
  const OFFLINE_CAP_SECONDS = 24 * 60 * 60;

  function buyMusicPlayer(){
    if (game.musicPlayerOwned || game.clicks < MUSIC_PLAYER_COST) return;
    game.clicks -= MUSIC_PLAYER_COST;
    game.musicPlayerOwned = true;
    updateCounter();
    saveGame();
    renderShop();
    showMusicPlayer();
  }

  function buyCursors(){
    if (game.cursorsOwned || game.clicks < CURSOR_COST) return;
    game.clicks -= CURSOR_COST;
    game.cursorsOwned = true;
    updateCounter();
    saveGame();
    renderShop();
    showCursorPicker();
  }

   function buyBackground(){
    if (game.bgOwned || game.clicks < BG_COST) return;
    game.clicks -= BG_COST;
    game.bgOwned = true;
    updateCounter();
    saveGame();
    renderShop();
    showBgPicker();
  }

  function buyOfflineEarnings(){
    if (game.offlineEarningsOwned || game.clicks < OFFLINE_COST) return;
    game.clicks -= OFFLINE_COST;
    game.offlineEarningsOwned = true;
    updateCounter();
    saveGame();
    renderShop();
  }

  function buyClickBoost(){
    const cost = clickBoostCost();
    if (game.clicks < cost) return;
    game.clicks -= cost;
    game.clickBoostOwned += 1;
    game.clickPower += 1;
    updateCounter();
    saveGame();
    renderShop();
  }

  function buyAutoClicker(){
    const cost = autoClickerCost();
    if (game.clicks < cost) return;
    game.clicks -= cost;
    game.autoClickerOwned += 1;
    updateCounter();
    saveGame();
    renderShop();
  }

  function buyDvd(){
    if (game.clicks < DVD_COST) return;
    game.clicks -= DVD_COST;
    game.dvdOwned += 1;
    updateCounter();
    saveGame();
    renderShop();
    spawnDvd();
  }

  function buyAmogus(){
    if (game.clicks < AMOGUS_COST) return;
    game.clicks -= AMOGUS_COST;
    game.amogusOwned += 1;
    game.amogusAlive += 1;
    updateCounter();
    saveGame();
    renderShop();
    spawnCrewmate();
  }

  function renderShop(){
    list.innerHTML = `
      <div class="shop-card">
        <div class="shop-info">
          <h3>Click Boost</h3>
          <p>+1 click power per click. <span class="owned">Owned: ${game.clickBoostOwned}</span></p>
        </div>
        <button class="buy-btn" id="buy-boost" ${game.clicks < clickBoostCost() ? 'disabled' : ''}>Buy (${clickBoostCost()})</button>
      </div>
      <div class="shop-card">
        <div class="shop-info">
          <h3>Clicker</h3>
          <p>+1 click every second, automatically. <span class="owned">Owned: ${game.autoClickerOwned}</span></p>
        </div>
        <button class="buy-btn" id="buy-auto" ${game.clicks < autoClickerCost() ? 'disabled' : ''}>Buy (${autoClickerCost()})</button>
      </div>
      <div class="shop-card">
        <div class="shop-info">
          <h3>DVD Logo</h3>
          <p>Spawns a bouncing logo that changes color on every wall bounce. <span class="owned">Owned: ${game.dvdOwned}</span></p>
        </div>
        <button class="buy-btn" id="buy-dvd" ${game.clicks < DVD_COST ? 'disabled' : ''}>Buy (${DVD_COST})</button>
      </div>
      <div class="shop-card">
        <div class="shop-info">
          <h3>DVD Layer</h3>
          <p>Send the DVD logos behind the page, or bring them back to the front.</p>
        </div>
        <button class="buy-btn" id="toggle-dvd-layer">${game.dvdBehind ? 'Bring Front' : 'Send Back'}</button>
      </div>
      <div class="shop-card">
        <div class="shop-info">
          <h3>Amogus</h3>
          <p>Spawns a crewmate who does 5 tasks, then wanders. Click him for 100 (or 200 once tasks are done). <span class="owned">Owned: ${game.amogusAlive}</span></p>
        </div>
        <button class="buy-btn" id="buy-amogus" ${game.clicks < AMOGUS_COST ? 'disabled' : ''}>Buy (${AMOGUS_COST})</button>
      </div>
      <div class="shop-card">
        <div class="shop-info">
          <h3>Music Player</h3>
          <p>One-time buy. Adds a song picker to the top of the page.</p>
        </div>
        <button class="buy-btn" id="buy-music" ${game.musicPlayerOwned ? 'disabled' : (game.clicks < MUSIC_PLAYER_COST ? 'disabled' : '')}>${game.musicPlayerOwned ? 'Owned' : 'Buy (' + MUSIC_PLAYER_COST + ')'}</button>
      </div>
      <div class="shop-card">
        <div class="shop-info">
          <h3>Custom Cursors</h3>
          <p>One-time buy. Adds a cursor picker to the top of the page.</p>
        </div>
        <button class="buy-btn" id="buy-cursors" ${game.cursorsOwned ? 'disabled' : (game.clicks < CURSOR_COST ? 'disabled' : '')}>${game.cursorsOwned ? 'Owned' : 'Buy (' + CURSOR_COST + ')'}</button>
      </div>
      <div class="shop-card">
        <div class="shop-info">
          <h3>Background Switcher</h3>
          <p>One-time buy. Adds a background picker to the top of the page.</p>
        </div>
               <button class="buy-btn" id="buy-bg" ${game.bgOwned ? 'disabled' : (game.clicks < BG_COST ? 'disabled' : '')}>${game.bgOwned ? 'Owned' : 'Buy (' + BG_COST + ')'}</button>
      </div>
      <div class="shop-card">
        <div class="shop-info">
          <h3>Offline Earnings</h3>
          <p>One-time buy. Keeps your Clicker upgrades earning clicks while the page is closed (capped at 24 hours away).</p>
        </div>
        <button class="buy-btn" id="buy-offline" ${game.offlineEarningsOwned ? 'disabled' : (game.clicks < OFFLINE_COST ? 'disabled' : '')}>${game.offlineEarningsOwned ? 'Owned' : 'Buy (' + OFFLINE_COST + ')'}</button>
      </div>
      <div class="save-load-bar">
        <button id="save-btn">Save Data</button>
        <button id="load-btn">Load Data</button>
      </div>
    `;

    document.getElementById('buy-boost').addEventListener('click', buyClickBoost);
    document.getElementById('buy-auto').addEventListener('click', buyAutoClicker);
    document.getElementById('buy-dvd').addEventListener('click', buyDvd);
    document.getElementById('toggle-dvd-layer').addEventListener('click', toggleDvdLayer);
    document.getElementById('buy-amogus').addEventListener('click', buyAmogus);
    document.getElementById('buy-music').addEventListener('click', buyMusicPlayer);
    document.getElementById('buy-cursors').addEventListener('click', buyCursors);
    document.getElementById('buy-bg').addEventListener('click', buyBackground);
    document.getElementById('buy-offline').addEventListener('click', buyOfflineEarnings);
    document.getElementById('save-btn').addEventListener('click', exportSave);
    document.getElementById('load-btn').addEventListener('click', () => loadInput.click());
  }

  /* ---------- MUSIC PLAYER ---------- */
  const SONGS = [
    { label: "Tidal Wave (Shiawase)", file: "shiawave__tidalwave_.mp3" },
    { label: "that friend who can always catch your tune", file: "tfwcacyt.mp3" },
    { label: "Lo-Fi Beats", file: "lofi.mp3" },
    { label: "Minecraft", file: "minecraft.mp3" },
    { label: "FIVE FIVE!", file: "55.mp3" },
    { label: "Lyin' 2 Me", file: "l2m.mp3" },
    { label: "Good to Be Alive", file: "gtba.mp3" },
    { label: "Show Yourself", file: "sy.mp3" },
    { label: "Masquerade Party", file: "mp.mp3" }
  ];

  const musicPlayerEl = document.getElementById('music-player');
  const songSelect = document.getElementById('song-select');
  const songAudio = document.getElementById('song-audio');
  const playBtn = document.getElementById('play-btn');
  const loopBtn = document.getElementById('loop-btn');

  function renderSongOption(song, index){
    const opt = document.createElement('option');
    opt.value = index;
    opt.textContent = song.label;
    songSelect.appendChild(opt);
  }

  SONGS.forEach(renderSongOption);

  function addSongOption(entry){
    const index = SONGS.length;
    SONGS.push(entry);
    renderSongOption(entry, index);
  }

  function loadSong(index){
    songAudio.src = SONGS[index].file;
  }

  songSelect.addEventListener('change', () => {
    const wasPlaying = !songAudio.paused;
    game.selectedSong = parseInt(songSelect.value, 10);
    loadSong(songSelect.value);
    saveGame();
    if (wasPlaying) songAudio.play();
    else playBtn.innerHTML = '&#9658;';
  });

  playBtn.addEventListener('click', () => {
    if (!songAudio.src) loadSong(songSelect.value);
    if (songAudio.paused) {
      songAudio.play();
    } else {
      songAudio.pause();
    }
  });

  songAudio.addEventListener('play', () => { playBtn.innerHTML = '&#10074;&#10074;'; });
  songAudio.addEventListener('pause', () => { playBtn.innerHTML = '&#9658;'; });

  function updateLoopBtn(){
    loopBtn.classList.toggle('active', songAudio.loop);
  }

  loopBtn.addEventListener('click', () => {
    songAudio.loop = !songAudio.loop;
    game.musicLoop = songAudio.loop;
    saveGame();
    updateLoopBtn();
  });

  function showMusicPlayer(){
    musicPlayerEl.classList.add('visible');
    const idx = game.selectedSong || 0;
    songSelect.value = idx;
    loadSong(idx);
    songAudio.loop = game.musicLoop;
    updateLoopBtn();
    if (game.musicLoop) {
      songAudio.play().catch(() => {});
    }
  }

  /* ---------- CURSOR PICKER ---------- */
  const cursorPickerEl = document.getElementById('cursor-picker');
  const cursorSelect = document.getElementById('cursor-select');

  const CURSORS = [
    { label: "Default", file: "default" },
    { label: "Duck", file: "duck.png" },
    { label: "Banana", file: "banan.png" },
    { label: "Error", file: "error.png" }
  ];

  function renderCursorOption(entry){
    const opt = document.createElement('option');
    opt.value = entry.file;
    opt.textContent = entry.label;
    cursorSelect.appendChild(opt);
  }

  CURSORS.forEach(renderCursorOption);

  function addCursorOption(entry){
    CURSORS.push(entry);
    renderCursorOption(entry);
  }

  const cursorCache = {};

  function resizeCursorImage(src, size){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(img, 0, 0, size, size);
        try {
          resolve(canvas.toDataURL());
        } catch (e) {
          reject(e);
        }
      };
      img.onerror = reject;
      img.src = src;
    });
  }

  async function applyCursor(value){
    if (value === 'default') {
      document.body.style.cursor = 'auto';
      document.body.classList.remove('custom-cursor-active');
      return;
    }

    document.body.classList.add('custom-cursor-active');

    if (!cursorCache[value]) {
      try {
        cursorCache[value] = await resizeCursorImage(value, 32);
      } catch (e) {
        cursorCache[value] = value;
      }
    }

    document.body.style.cursor = `url('${cursorCache[value]}') 16 16, auto`;
  }

  cursorSelect.addEventListener('change', () => {
    game.selectedCursor = cursorSelect.value;
    applyCursor(game.selectedCursor);
    saveGame();
  });

  function showCursorPicker(){
    cursorPickerEl.classList.add('visible');
    cursorSelect.value = game.selectedCursor;
    applyCursor(game.selectedCursor);
  }

  /* ---------- OFFLINE EARNINGS ---------- */
  function formatDuration(seconds){
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    const parts = [];
    if (h) parts.push(h + 'h');
    if (m) parts.push(m + 'm');
    if (!h && !m) parts.push(s + 's');
    return parts.join(' ');
  }

  function showOfflineBanner(earned, seconds){
    const banner = document.createElement('div');
    banner.className = 'offline-banner';
    banner.textContent = `Welcome back! +${earned.toLocaleString()} clicks earned while away (${formatDuration(seconds)}).`;
    document.body.appendChild(banner);
    requestAnimationFrame(() => banner.classList.add('visible'));
    setTimeout(() => {
      banner.classList.remove('visible');
      setTimeout(() => banner.remove(), 500);
    }, 5000);
  }

  function applyOfflineEarnings(){
    if (!game.offlineEarningsOwned || !game.lastSeen) return;

    const elapsedMs = Date.now() - game.lastSeen;
    if (elapsedMs <= 1000) return;

    const elapsedSeconds = Math.floor(elapsedMs / 1000);
    const cappedSeconds = Math.min(elapsedSeconds, OFFLINE_CAP_SECONDS);
    const earned = cappedSeconds * game.autoClickerOwned;

    if (earned > 0) {
      game.clicks += earned;
      saveGame();
      showOfflineBanner(earned, cappedSeconds);
    }
  }

  /* ---------- BACKGROUND SWITCHER ----------
     Add your own backgrounds to this list. Each entry needs:
       label - shown in the dropdown
       file  - "default" for the site's normal background, or an image
               filename (uploaded to the server) to use as a full-page background
     Example:
       { label: "Space", file: "space.png" }
  ------------------------------------------------- */
  const BACKGROUNDS = [
    { label: "Default", file: "default" },
    { label: "Backrooms", file: "backroom.jpeg" },
    { label: "Grace", file: "zen.jpeg" },
    { label: "Space Nebula", file: "space.jpg" }
  ];

  const bgPickerEl = document.getElementById('bg-picker');
  const bgSelect = document.getElementById('bg-select');

  function renderBgOption(bg){
    const opt = document.createElement('option');
    opt.value = bg.file;
    opt.textContent = bg.label;
    bgSelect.appendChild(opt);
  }

  BACKGROUNDS.forEach(renderBgOption);

  function addBackgroundOption(entry){
    BACKGROUNDS.push(entry);
    renderBgOption(entry);
  }

  function loadCustomAssets(){
    (game.customBackgrounds || []).forEach(entry => {
      if (!BACKGROUNDS.some(b => b.file === entry.file)) addBackgroundOption(entry);
    });
    (game.customSongs || []).forEach(entry => {
      if (!SONGS.some(s => s.file === entry.file)) addSongOption(entry);
    });
    (game.customCursors || []).forEach(entry => {
      if (!CURSORS.some(c => c.file === entry.file)) addCursorOption(entry);
    });
  }

  function applyBackground(file){
    if (file === 'default') {
      document.body.style.backgroundImage = '';
      document.body.style.backgroundSize = '';
      document.body.style.backgroundPosition = '';
      document.body.style.backgroundRepeat = '';
      return;
    }
    document.body.style.backgroundImage = `url('${file}')`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundRepeat = 'no-repeat';
  }

  bgSelect.addEventListener('change', () => {
    game.selectedBg = bgSelect.value;
    applyBackground(game.selectedBg);
    saveGame();
  });

  /* ---------- IMPORT (image / sound / mouse) ---------- */
  const importFileInput = document.getElementById('import-file-input');
  let importKind = null;

  function showToast(message){
    const banner = document.createElement('div');
    banner.className = 'offline-banner';
    banner.textContent = message;
    document.body.appendChild(banner);
    requestAnimationFrame(() => banner.classList.add('visible'));
    setTimeout(() => {
      banner.classList.remove('visible');
      setTimeout(() => banner.remove(), 500);
    }, 4000);
  }

  function openImportPicker(kind){
    importKind = kind;
    importFileInput.accept = (kind === 'sound') ? 'audio/*' : 'image/*';
    importFileInput.value = '';
    importFileInput.click();
  }

  importFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const label = file.name.replace(/\.[^/.]+$/, '') || 'Custom';

      if (importKind === 'image') {
        const entry = { label: label, file: dataUrl };
        if (!BACKGROUNDS.some(b => b.file === dataUrl)) {
          addBackgroundOption(entry);
          game.customBackgrounds.push(entry);
          saveGame();
        }
        showToast(`Added "${label}" to Background Switcher.`);
      } else if (importKind === 'sound') {
        const entry = { label: label, file: dataUrl };
        if (!SONGS.some(s => s.file === dataUrl)) {
          addSongOption(entry);
          game.customSongs.push(entry);
          saveGame();
        }
        showToast(`Added "${label}" to the Music Player.`);
      } else if (importKind === 'mouse') {
        const entry = { label: label, file: dataUrl };
        if (!CURSORS.some(c => c.file === dataUrl)) {
          addCursorOption(entry);
          game.customCursors.push(entry);
          saveGame();
        }
        showToast(`Added "${label}" to Custom Cursors.`);
      }
    };
    reader.readAsDataURL(file);
  });

  function showBgPicker(){
    bgPickerEl.classList.add('visible');
    bgSelect.value = game.selectedBg;
    applyBackground(game.selectedBg);
  }

  /* ---------- DVD LOGO ---------- */
  const DVD_COLORS = ['#57ab46', '#79cf67', '#c1aef0', '#faf3df', '#ff6f9c', '#66c2ff'];

  function spawnDvd(){
    const dvd = document.createElement('div');
    dvd.className = 'dvd-logo';
    if (game.dvdBehind) dvd.classList.add('behind');
    dvd.textContent = 'DVD\nVIDEO';
    document.body.appendChild(dvd);

    let x = Math.random() * (window.innerWidth - 90);
    let y = Math.random() * (window.innerHeight - 60);
    let vx = (Math.random() < 0.5 ? -1 : 1) * (1.8 + Math.random() * 1.2);
    let vy = (Math.random() < 0.5 ? -1 : 1) * (1.8 + Math.random() * 1.2);
    let colorIndex = Math.floor(Math.random() * DVD_COLORS.length);
    dvd.style.color = DVD_COLORS[colorIndex];

    function tick(){
      if (!document.body.contains(dvd)) return;

      const w = dvd.offsetWidth || 90;
      const h = dvd.offsetHeight || 60;

      x += vx;
      y += vy;

      let xBounced = false;
      let yBounced = false;

      if (x <= 0) { x = 0; vx = Math.abs(vx); xBounced = true; }
      if (x + w >= window.innerWidth) { x = window.innerWidth - w; vx = -Math.abs(vx); xBounced = true; }
      if (y <= 0) { y = 0; vy = Math.abs(vy); yBounced = true; }
      if (y + h >= window.innerHeight) { y = window.innerHeight - h; vy = -Math.abs(vy); yBounced = true; }

      if (xBounced || yBounced) {
        colorIndex = (colorIndex + 1) % DVD_COLORS.length;
        dvd.style.color = DVD_COLORS[colorIndex];
        game.clicks += game.clickPower;

        if (xBounced && yBounced) {
          game.clicks += CORNER_BONUS;
        }

        updateCounter();
        saveGame();
      }

      dvd.style.transform = `translate(${x}px, ${y}px)`;
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  }

  function toggleDvdLayer(){
    game.dvdBehind = !game.dvdBehind;
    document.querySelectorAll('.dvd-logo').forEach(el => el.classList.toggle('behind', game.dvdBehind));
    saveGame();
    renderShop();
  }

  /* ---------- CREWMATE (AMOGUS) ---------- */
  const CREWMATE_COLORS = ['#c51111','#132ed1','#117f2d','#ed54ba','#ef7d0d','#f5f557','#3f474e','#d6e0f0','#6b2fbb','#71491e','#38fedc','#50ef39'];
  const TASK_COUNT = 5;
  let TASK_POSITIONS = [];
  let taskMarkersReady = false;

  function ensureTaskMarkers(){
    if (taskMarkersReady) return;
    taskMarkersReady = true;

    const margin = 36;
    const usable = window.innerWidth - margin * 2;
    TASK_POSITIONS = Array.from({ length: TASK_COUNT }, (_, i) => margin + (usable * i / (TASK_COUNT - 1)));

    TASK_POSITIONS.forEach(x => {
      const marker = document.createElement('div');
      marker.className = 'task-marker';
      marker.style.left = (x - 8) + 'px';
      marker.textContent = '!';
      document.body.appendChild(marker);
    });
  }

  function spawnCrewmate(){
    ensureTaskMarkers();

    const el = document.createElement('div');
    el.className = 'crewmate';
    el.style.setProperty('--ccolor', CREWMATE_COLORS[Math.floor(Math.random() * CREWMATE_COLORS.length)]);
    el.innerHTML = `
      <div class="body">
        <div class="backpack"></div>
        <div class="shell"></div>
        <div class="legs"></div>
        <div class="visor"></div>
      </div>
    `;
    document.body.appendChild(el);

    let x = Math.random() * (window.innerWidth - 36);
    let direction = Math.random() < 0.5 ? -1 : 1;
    let speed = 0.6 + Math.random() * 0.8;
    let dead = false;
    let taskIndex = 0;
    let tasksDone = false;
    let workingUntil = null;

    el.style.bottom = '16px';
    el.style.left = x + 'px';
    el.classList.add('tasking');
    if (direction < 0) el.classList.add('facing-left');

    el.addEventListener('click', () => {
      if (dead) return;
      dead = true;
      el.classList.add('dead');
      el.classList.remove('working', 'tasking', 'done');
      game.clicks += tasksDone ? 200 : 100;
      game.amogusAlive = Math.max(0, game.amogusAlive - 1);
      updateCounter();
      saveGame();
      if (activeTab === 'shop') renderShop();
      setTimeout(() => {
        el.style.transition = 'opacity 1s ease';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 1000);
      }, 3000);
    });

    function walk(){
      if (!document.body.contains(el)) return;

      if (!dead) {
        if (!tasksDone) {
          const targetX = TASK_POSITIONS[taskIndex];

          if (workingUntil !== null) {
            if (Date.now() >= workingUntil) {
              workingUntil = null;
              el.classList.remove('working');
              taskIndex += 1;
              if (taskIndex >= TASK_POSITIONS.length) {
                tasksDone = true;
                el.classList.remove('tasking');
                el.classList.add('done');
              }
            }
          } else {
            const dx = targetX - x;
            if (Math.abs(dx) < 2) {
              workingUntil = Date.now() + 1300;
              el.classList.add('working');
            } else {
              direction = dx > 0 ? 1 : -1;
              el.classList.toggle('facing-left', direction < 0);
              x += direction * speed;
            }
          }
        } else {
          x += direction * speed;
          const maxX = window.innerWidth - 36;

          if (x <= 0) { x = 0; direction = 1; el.classList.remove('facing-left'); }
          if (x >= maxX) { x = maxX; direction = -1; el.classList.add('facing-left'); }
          if (Math.random() < 0.004) {
            direction *= -1;
            el.classList.toggle('facing-left', direction < 0);
          }
        }

        el.style.left = x + 'px';
      }

      requestAnimationFrame(walk);
    }

    requestAnimationFrame(walk);
  }

  /* ---------- TABS ---------- */
  function renderTabs(){
    tabBar.innerHTML = "";

    TABS.forEach(tab => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (tab.id === activeTab ? ' active' : '');
      btn.textContent = tab.label;
      btn.addEventListener('click', () => {
        activeTab = tab.id;
        renderTabs();
        renderActiveTab();
      });
      tabBar.appendChild(btn);
    });
  }

  function renderActiveTab(){
    if (activeTab === 'shop') {
      renderShop();
    } else {
      renderLinks(TABS.find(t => t.id === activeTab).data);
    }
  }

  function renderLinks(items){
    list.innerHTML = "";

    if (!items || items.length === 0) {
      list.innerHTML = '<div class="empty-state">Nothing here yet &mdash; add an entry to this list in the script to see it here.</div>';
      return;
    }

    items.forEach(item => {
      const card = document.createElement('a');
      card.className = 'link-card';
      card.href = item.link || '#';

      card.innerHTML = `
        <div class="link-thumb">
          <img src="${item.image}" alt="${item.name}">
        </div>
        <div class="link-text">
          <h3>${item.name}</h3>
          <p>${item.desc}</p>
        </div>
        <span class="link-arrow">&rarr;</span>
      `;

      list.appendChild(card);
    });
  }

    /* ---------- SPOOPY / MYSTERY MENU ---------- */
  const spoopyBtn = document.getElementById('spoopy-btn');
  const mysteryOverlay = document.getElementById('mystery-overlay');
  const mysteryInput = document.getElementById('mystery-input');
  const mysterySubmit = document.getElementById('mystery-submit');
  const mysteryClose = document.getElementById('mystery-close');
  const mysterySpinner = document.getElementById('mystery-spinner');

  function openMystery(){
    mysteryOverlay.classList.add('visible');
    mysteryInput.value = '';
    mysteryInput.style.display = '';
    mysterySubmit.style.display = '';
    mysterySpinner.style.display = 'none';
    mysteryInput.focus();
  }

  function closeMystery(){
    mysteryOverlay.classList.remove('visible');
  }

  spoopyBtn.addEventListener('click', openMystery);
  mysteryClose.addEventListener('click', closeMystery);
  mysteryOverlay.addEventListener('click', (e) => {
    if (e.target === mysteryOverlay) closeMystery();
  });

  /* ======================================================
     PRINT COMMAND TARGETS
     "print dvd" logs the value each function returns.
     Add more entries here to make more things printable.
     ====================================================== */
  const PRINT_MAP = {
    dvd: () => game.dvdOwned,
    clicks: () => game.clicks,
    boost: () => game.clickBoostOwned,
    clicker: () => game.autoClickerOwned,
    amogus: () => game.amogusAlive,
    song: () => (SONGS[game.selectedSong] ? SONGS[game.selectedSong].label : game.selectedSong),
    bg: () => game.selectedBg,
    mouse: () => game.selectedCursor
  };

  function handlePrintCommand(raw){
    const rest = raw.replace(/^print\s+/i, '').trim();
    const quotedMatch = rest.match(/^"([\s\S]*)"$/);

    if (quotedMatch) {
      console.log(quotedMatch[1]);
      return;
    }

    const key = rest.toLowerCase();
    if (Object.prototype.hasOwnProperty.call(PRINT_MAP, key)) {
      console.log(PRINT_MAP[key]());
    } else {
      console.log(`print: unknown target "${rest}"`);
    }
  }

  function submitMysteryAnswer(){
    const answer = mysteryInput.value.trim();
    if (!answer) return;

    mysteryInput.style.display = 'none';
    mysterySubmit.style.display = 'none';
    mysterySpinner.style.display = 'block';

    /* ======================================================
       ANSWER LOGIC GOES HERE.
       "normalized" holds whatever was typed, lowercased.
       Add checks like:
         if (normalized === 'some phrase') { ...do something... }
       Tell me what answers should do and I'll fill this in.
       ====================================================== */
    const normalized = answer.toLowerCase();

    setTimeout(() => {
      mysterySpinner.style.display = 'none';

      if (normalized === 'menu') {
        closeMystery();
        openAdminPanel();
        return;
      }

      if (normalized.startsWith('import ')) {
        const kind = normalized.slice(7).trim();
        if (kind === 'image' || kind === 'sound' || kind === 'mouse') {
          closeMystery();
          openImportPicker(kind);
          return;
        }
      }

      if (/^print\s+/i.test(answer)) {
        handlePrintCommand(answer);
      }

      // Placeholder for other answers - just resets the form for now.
      mysteryInput.style.display = '';
      mysterySubmit.style.display = '';
      mysteryInput.value = '';
    }, 2000);
  }

  mysterySubmit.addEventListener('click', submitMysteryAnswer);
  mysteryInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitMysteryAnswer();
  });

  /* ---------- ADMIN PANEL ---------- */
  const adminPanel = document.getElementById('admin-panel');
  const adminHeader = document.getElementById('admin-header');
  const adminCollapseBtn = document.getElementById('admin-collapse');
  const adminCloseBtn = document.getElementById('admin-close');
  const adminApplyBtn = document.getElementById('admin-apply');

  const adminClicksInput = document.getElementById('admin-clicks');
  const adminBoostInput = document.getElementById('admin-boost');
  const adminAutoInput = document.getElementById('admin-auto');
  const adminDvdInput = document.getElementById('admin-dvd');
  const adminAmogusInput = document.getElementById('admin-amogus');
  const adminOfflineInput = document.getElementById('admin-offline');
  const adminBgInput = document.getElementById('admin-bg');
  const adminCursorsInput = document.getElementById('admin-cursors');
  const adminMusicInput = document.getElementById('admin-music');

  function openAdminPanel(){
    adminClicksInput.value = game.clicks;
    adminBoostInput.value = game.clickBoostOwned;
    adminAutoInput.value = game.autoClickerOwned;
    adminDvdInput.value = game.dvdOwned;
    adminAmogusInput.value = game.amogusAlive;
    adminOfflineInput.checked = game.offlineEarningsOwned;
    adminBgInput.checked = game.bgOwned;
    adminCursorsInput.checked = game.cursorsOwned;
    adminMusicInput.checked = game.musicPlayerOwned;

    adminPanel.classList.add('visible');
    adminPanel.classList.remove('collapsed');
  }

  const adminExpandBtn = document.getElementById('admin-expand');

  adminCloseBtn.addEventListener('click', () => {
    adminPanel.classList.remove('visible', 'expanded', 'collapsed');
    adminCollapseBtn.innerHTML = '&#8722;';
    adminExpandBtn.innerHTML = '&#10530;';
  });

  adminCollapseBtn.addEventListener('click', () => {
    adminPanel.classList.toggle('collapsed');
    adminCollapseBtn.innerHTML = adminPanel.classList.contains('collapsed') ? '&#43;' : '&#8722;';
  });

  adminExpandBtn.addEventListener('click', () => {
    adminPanel.classList.toggle('expanded');
    const isExpanded = adminPanel.classList.contains('expanded');
    adminExpandBtn.innerHTML = isExpanded ? '&#10529;' : '&#10530;';
    if (isExpanded) {
      adminPanel.classList.remove('collapsed');
      adminCollapseBtn.innerHTML = '&#8722;';
    }
  });

  // Dragging (mouse + touch, via pointer events)
  let adminDragging = false;
  let adminOffsetX = 0;
  let adminOffsetY = 0;

  adminHeader.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.admin-icon-btn')) return;
    adminDragging = true;
    const rect = adminPanel.getBoundingClientRect();
    adminOffsetX = e.clientX - rect.left;
    adminOffsetY = e.clientY - rect.top;
    adminHeader.setPointerCapture(e.pointerId);
  });

  adminHeader.addEventListener('pointermove', (e) => {
    if (!adminDragging) return;
    const maxLeft = Math.max(0, window.innerWidth - adminPanel.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - adminPanel.offsetHeight);
    const left = Math.min(Math.max(0, e.clientX - adminOffsetX), maxLeft);
    const top = Math.min(Math.max(0, e.clientY - adminOffsetY), maxTop);
    adminPanel.style.left = left + 'px';
    adminPanel.style.top = top + 'px';
  });

  adminHeader.addEventListener('pointerup', () => { adminDragging = false; });
  adminHeader.addEventListener('pointercancel', () => { adminDragging = false; });

  adminApplyBtn.addEventListener('click', () => {
    const clicksVal = parseInt(adminClicksInput.value, 10);
    game.clicks = isNaN(clicksVal) ? 0 : Math.max(0, clicksVal);

    const boostVal = parseInt(adminBoostInput.value, 10);
    game.clickBoostOwned = isNaN(boostVal) ? 0 : Math.max(0, boostVal);
    game.clickPower = 1 + game.clickBoostOwned;

    const autoVal = parseInt(adminAutoInput.value, 10);
    game.autoClickerOwned = isNaN(autoVal) ? 0 : Math.max(0, autoVal);

    const dvdVal = parseInt(adminDvdInput.value, 10);
    game.dvdOwned = isNaN(dvdVal) ? 0 : Math.max(0, dvdVal);
    document.querySelectorAll('.dvd-logo').forEach(el => el.remove());
    for (let i = 0; i < game.dvdOwned; i++) spawnDvd();

    const amogusVal = parseInt(adminAmogusInput.value, 10);
    const safeAmogus = isNaN(amogusVal) ? 0 : Math.max(0, amogusVal);
    game.amogusOwned = safeAmogus;
    game.amogusAlive = safeAmogus;
    document.querySelectorAll('.crewmate').forEach(el => el.remove());
    for (let i = 0; i < safeAmogus; i++) spawnCrewmate();

    game.offlineEarningsOwned = adminOfflineInput.checked;

    game.bgOwned = adminBgInput.checked;
    if (game.bgOwned) showBgPicker();
    else bgPickerEl.classList.remove('visible');

    game.cursorsOwned = adminCursorsInput.checked;
    if (game.cursorsOwned) showCursorPicker();
    else cursorPickerEl.classList.remove('visible');

    game.musicPlayerOwned = adminMusicInput.checked;
    if (game.musicPlayerOwned) {
      showMusicPlayer();
    } else {
      musicPlayerEl.classList.remove('visible');
      songAudio.pause();
    }

    updateCounter();
    saveGame();
    if (activeTab === 'shop') renderShop();
  });

  loadGame();
  if (game.amogusAlive === undefined) game.amogusAlive = game.amogusOwned;
  loadCustomAssets();
  applyOfflineEarnings();
  updateCounter();
  if (game.musicPlayerOwned) showMusicPlayer();
  if (game.cursorsOwned) showCursorPicker();
  if (game.bgOwned) showBgPicker();
  for (let i = 0; i < game.dvdOwned; i++) spawnDvd();
  for (let i = 0; i < game.amogusAlive; i++) spawnCrewmate();

    renderTabs();
  renderActiveTab();

  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveGame();
  });
</script>

</body>
